<!DOCTYPE html>
<html>
<head><title>API Debug</title>
<style>body{font-family:monospace;padding:20px;} pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow:auto;font-size:12px;} h3{margin-top:20px;color:#0a3d1f;} button{padding:8px 16px;background:#1a7a4a;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:4px;font-size:13px;} .err{color:red;}</style>
</head>
<body>
<h2>🔍 API-Football Debug</h2>
<button onclick="testScorers()">Test Top Scorers</button>
<button onclick="testFixtures()">Test Fixtures (FT)</button>
<button onclick="testLive()">Test Live</button>
<button onclick="testSeason()">Test Season Info</button>
<div id="out"></div>
<script>
const KEY = 'c4c9b669d09891e1339781f330e5c3d4';
const BASE = 'https://v3.football.api-sports.io';

async function call(url) {
  document.getElementById('out').innerHTML = '<p>Loading: '+url+'</p>';
  try {
    const r = await fetch(BASE+url, {headers:{'x-apisports-key':KEY}});
    const d = await r.json();
    document.getElementById('out').innerHTML = '<h3>URL: '+url+'</h3><p>Results: '+d.results+'</p><pre>'+JSON.stringify(d.response?.slice?.(0,3)||d.response, null, 2)+'</pre>';
  } catch(e) {
    document.getElementById('out').innerHTML = '<p class="err">Error: '+e.message+'</p>';
  }
}

function testScorers(){ call('/players/topscorers?league=1&season=2026'); }
function testFixtures(){ call('/fixtures?league=1&season=2026&status=FT'); }
function testLive(){ call('/fixtures?league=1&season=2026&live=all'); }
function testSeason(){ call('/leagues?id=1'); }
</script>
</body>
</html>
